<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>飞常准 · 航班动态</title>
<script src="https://res.wx.qq.com/open/js/cloudbase/1.1.0/cloud.js"></script>
<style>
html,body{margin:0;padding:0}
body{min-height:100vh;min-height:100dvh;background:#fffdf7;color:#3d3729;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;align-items:center;justify-content:center;text-align:center}
.card{max-width:560px;margin:0 auto;padding:52px 28px 60px}
.logo{width:72px;height:72px;border-radius:18px;background:#4a90e2;margin:0 auto 20px;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px rgba(74,144,226,.28)}
h1{font-size:21px;margin:0 0 12px;font-weight:600;line-height:1.5}
p{font-size:15px;line-height:1.8;color:#7a7260;margin:0 0 22px}
b{color:#3d3729}
.btn{display:inline-block;background:#4a90e2;color:#fff;text-decoration:none;font-size:16px;font-weight:500;padding:13px 34px;border-radius:999px;border:none;box-shadow:0 6px 16px rgba(74,144,226,.3)}
.btn:active{opacity:.85}
.hide{display:none}
.url{font-size:12px;word-break:break-all;background:#f4efe3;border-radius:10px;padding:12px 14px;color:#8a8270;margin-top:6px;line-height:1.7}
.tip{font-size:12px;color:#a89f8a;margin-top:18px}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <svg viewBox="0 0 20 20" width="44" height="44" aria-hidden="true">
      <rect x="1" y="9.7" width="18" height="2.1" rx="1.05" fill="#fff"/>
      <circle cx="4.3" cy="12.5" r="1.5" fill="#fff"/>
      <circle cx="15.7" cy="12.5" r="1.5" fill="#fff"/>
      <path d="M10,1.6 L11.2,6.4 L8.8,6.4 Z" fill="#fff"/>
      <circle cx="10" cy="10.4" r="4.5" fill="#fff"/>
      <path d="M6.9,9.5 a3.1,2.4 0 0 1 6.2,0 q-3.1,1.1 -6.2,0 Z" fill="#4a90e2"/>
      <path d="M5,20 Q10,15.8 15,20 Z" fill="#fff"/>
    </svg>
  </div>
  <h1 id="tt">正在为你打开飞常准小程序…</h1>
  <p id="msg"></p>
  <a id="go" class="btn hide" href="javascript:;">打开飞常准小程序</a>
  <div id="copybox" class="hide"><div class="url" id="urllink"></div></div>
  <div class="tip">微信 / 电脑端自动打开携程航班动态(含值机柜台·登机口·行李转盘)；非微信手机浏览器经「飞常准」小程序查看</div>
</div>
<script>
(function(){
  var ua = navigator.userAgent.toLowerCase();
  var isWx = ua.indexOf('micromessenger') > -1;
  var isMob = /android|iphone|ipad|ipod|mobile|harmonyos/.test(ua);
  var tt = document.getElementById('tt'), msg = document.getElementById('msg'),
      go = document.getElementById('go'), box = document.getElementById('copybox'),
      urllink = document.getElementById('urllink');
  var q = location.search.slice(1);
  var mpath = (function(){ var m = location.search.match(/[?&]path=([^&]*)/); return m ? decodeURIComponent(m[1]) : '/pages/detail/detail'; })();
  var fn = (function(){ var m = q.match(/fnum=([^&]*)/); return m ? decodeURIComponent(m[1]) : ''; })();
  var dt = (function(){ var m = q.match(/date=([^&]*)/); return m ? decodeURIComponent(m[1]) : ''; })();
  if (fn) tt.textContent = '正在为你打开 ' + fn + ' 航班动态…';

  if (!isWx && isMob) {
    msg.textContent = '正在连接飞常准服务…';
    (async function(){
      try {
        var c = new cloud.Cloud({identityless:true, resourceAppid:'wx1c1b6e46a5b0cbab', resourceEnv:'feeyo-4gavslyd9088a553'});
        await c.init();
        var r = await c.callFunction({name:'openMini', data:{action:'openMp', query:q, mpath:mpath}});
        var link = r && r.result && r.result.openlink;
        if (!link) throw new Error('未获取到跳转链接');
        go.href = link;
        go.classList.remove('hide');
        msg.textContent = '若未自动跳转，请点击下方按钮打开小程序。';
        location.href = link;
      } catch(e) {
        webFallback();
      }
    })();
  } else {
    webFallback();
  }

  function webFallback(){
    var ct = 'https://flights.ctrip.com/actualtime/detail?flightNo=' + encodeURIComponent(fn || '') + '&depDate=' + encodeURIComponent(dt || '');
    var bd = 'https://www.baidu.com/s?wd=' + encodeURIComponent((fn || '航班') + ' 航班动态');
    tt.textContent = '正在打开 ' + (fn || '') + ' 航班动态…';
    msg.innerHTML = '网页版航班动态含<b>值机柜台、登机口、行李转盘</b>等信息。<br>若未自动跳转，请点击下方按钮。';
    go.href = ct;
    go.textContent = '打开携程航班动态';
    go.classList.remove('hide');
    urllink.innerHTML = '备用：<a href="' + bd + '" style="color:#4a90e2">百度版航班动态</a>';
    box.classList.remove('hide');
    setTimeout(function(){ location.replace(ct); }, 500);
  }
})();
</script>
</body>
</html>
